# netgraph — the mesh as a picture: routing truth locally, remote management
# for the rest.
#
# The graph has two sources. What this node knows for free — its own path table
# and interface state, so the drawing changes the moment its state does — and
# what other nodes know when asked, over Reticulum's own remote-management
# service (`/path` and `/status` on `rnstransport.remote.management`), visited
# node by node by a crawl a human started. The second half works against stock
# Reticulum installations, which is the point of using their protocol rather
# than one of ours.
#
# A client of rnsd like any other: it joins the RNS lifecycle at
# RNS_PHASE_CLIENT, reads rnsd's path table and interface walk, and resolves the
# union into the `netgraph.*` rows the browser window draws. rnsd holds the
# ports it listens on (NETGRAPH_SYNC_PORT / NETGRAPH_REQ_PORT in rns's
# ports.h) and the announce claim it takes, exactly as it holds every other
# consumer's — this straddle adds no surface there.
#
# Optional, and pulled in by name: nothing requires it, so a build gets the
# graph only by asking (`--with reticulous/netgraph`). An interface straddle
# that wants its configuration on its own `if` line gates the call on
# CONFIG_STRADDLE_NETGRAPH and compiles away without it.
schema_version: 1
name: reticulous/netgraph
prefix: netgraph
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]

requires:
  - reticulous/rns

# Boot-registered Service. A client of rnsd (RNS_PHASE_CLIENT), so it joins the
# RNS lifecycle rather than the boot band: it reads the routing and interface
# state, serves and crawls remote management, and resolves the union into the
# netgraph.* rows the browser reads. The non-settings defaults are seeded in
# code (storageDefaultTree) rather than declared here — nothing about them
# belongs on a settings pane.
services:
  - { class: NetgraphService, header: netgraph.h }

# Browser-side UI registration — auto-wired into the buildable SPA via
# straddles.gen.ts; no web-interface edit needed.
browser_register:
  - call: registerNetgraph
    module: modules/netgraph

# Declarative settings: both surfaces + storage defaults generated from this
# block.
settings:
  # NetGraph sits under Reticulum beside Interfaces: it is a view of the mesh
  # and a way of asking other nodes about theirs, so it belongs where the mesh
  # is configured rather than in a menu of its own. rnsd names the `reticulum`
  # menu itself; this states only the bare id and its own level-2 heading.
  - at:
      - { id: reticulum }
      - { id: netgraph, label: "NetGraph", order: 2 }
    order: 2
    rows:
      - title: "NetGraph"
      - switch: { label: "Enable NetGraph", key: "s.netgraph.enable", default: 1 }
      - caption: "Draws the mesh from this node's own routing and interface
                  state. The picture costs no traffic; only a crawl does."

      - section: "Community"
      - caption: "A community is one name and one passphrase, shared by every
                  node in it. Both together derive a keypair that admits any
                  node holding them — nothing is exchanged and there is nothing
                  to configure per peer. Anyone with the passphrase can query
                  every node that trusts it, so treat it as the community's
                  access credential rather than as a network name."
      - text:   { label: "Community name", key: "s.netgraph.community",
                  placeholder: "unset — no community" }
      - text:   { label: "Passphrase", key: "s.netgraph.passphrase", secret: true }
      # Only once a key has actually been derived. Deriving takes a few seconds
      # on the slowest boards, so an operator who has just typed a passphrase is
      # watching for exactly this row to appear.
      - when_key: "netgraph.community.id"
        value: { label: "Community identity", key: "netgraph.community.id",
                 copyable: true }
      - when_key: "netgraph.community.id"
        caption: "Ask remote nodes that do not have NetGraph to enable network
                  management and to allow access to this identity to make them
                  answer queries by this community."

      - section: "Serving"
      - switch: { label: "Answer remote queries", key: "s.netgraph.serve", default: 1 }
      - caption: "Answers /path and /status on the stock Reticulum management
                  address, so `rnstatus -R` from an unmodified installation
                  works. Only the community and the identities below may ask;
                  an unidentified request is refused."
      - list:
          label: "Additional access"
          caption: "Identities allowed to query this node besides the
                    community — for a node outside it whose operator you know.
                    Same form as Reticulum's own remote_management_allowed, so
                    a line copies straight across either way."
          key: s.netgraph.allow
          id: id
          item: "{hash}"
          empty: "No individual identities granted."
          cmd: netgraph.allow
          add:
            - label: "Allow an identity"
              form:
                title: "Allow an identity"
                submit: "Allow"
                fields:
                  - text: { label: "Identity hash", field: hash,
                            placeholder: "32 hexadecimal characters" }
          remove: { confirm: "Stop allowing {hash}?" }

      - section: "Crawling"
      - caption: "A crawl asks each node in range for its own routes and
                  interfaces, one link at a time. It runs when you press the
                  button in the NetGraph window and at no other time — it
                  spends somebody else's airtime."
      - integer: { label: "Radius", unit: "hops", key: "s.netgraph.radius", min: 1, max: 4, default: 2 }
      - integer: { label: "Give up after", unit: "s", key: "s.netgraph.crawl_timeout_s", min: 5, max: 120, default: 20 }
      - integer: { label: "Forget unheard peers after", unit: "h", key: "s.netgraph.heard_h", min: 1, max: 48, default: 3 }
      - caption: "A peer nothing has heard from for this long leaves the
                  drawing. Lines are removed rather than dimmed: everything on
                  the picture is current."
